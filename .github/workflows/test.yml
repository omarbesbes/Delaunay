name: tests

# The tests need neither torch nor a GPU (the converter test skips itself without torch), so the
# config/job consistency checks run on every push.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install numpy scipy pytest PyYAML
      - run: pytest -q
