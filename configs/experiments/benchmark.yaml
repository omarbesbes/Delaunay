description: Correctness against CGAL on the two raw point clouds (the job adds a jitter=1e-6 pass)
study: benchmark

# The two photogrammetric clouds.  Duplicate points are removed and the coordinates normalised
# into the unit cube before anything else; see docs/jitter_sweep.md section 0.
ply:
  - data/voronoi_iarpa_001.ply
  - data/voronoi_jax_068.ply
no_analytic: true
models: true
unit_cube: true

# The cloud exactly as measured -- the pass in which degeneracy shows.  run_benchmark.sbatch
# runs a second pass with jitter=1e-6 and the report puts the two side by side; standalone,
# `python main.py experiment=benchmark jitter=1e-6` is the clean triangulation.
jitter: 0

repeats: 3
slow_repeats: 2
slow_threshold: 100
geodel: auto
verbose: true
json: results/benchmark/results.json
